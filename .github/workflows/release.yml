name: release

on:
  push:
    branches: [main]
  # Lets a maintainer re-run just the publish step (e.g. after fixing auth)
  # without release-please needing to cut a whole new version for it.
  workflow_dispatch:

# release-please needs to open/update its release PR and cut tags/releases.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Uses release-please-config.json + .release-please-manifest.json.
          # Prefer a PAT so release-please's PR triggers CI (the default
          # GITHUB_TOKEN cannot, by design — GitHub blocks workflow recursion,
          # so the required check never runs and merges need `--admin`). Falls
          # back to GITHUB_TOKEN when the secret is absent (current behaviour).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    name: publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing (OIDC) needs npm >= 11.5.1; the runner's bundled
      # npm may lag behind, so pin it explicitly rather than trust the image.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # No NODE_AUTH_TOKEN: npm exchanges the id-token: write OIDC token above
      # for a short-lived publish credential via Trusted Publishing — set up
      # on npmjs.com under the turnbell package's Trusted Publisher settings.
      - run: npm publish --provenance --access public
