name: Bug report
description: Something in turnbell isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! For **security** issues, do not file here — see
        [SECURITY.md](https://github.com/paurushrai/turnbell/security).
  - type: input
    id: version
    attributes:
      label: turnbell version
      description: "Output of `turnbell --version`"
      placeholder: "turnbell 1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent
      description: Which coding agent (Claude Code, Codex, Gemini CLI, …) or `turnbell run`?
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Include exact error output if any.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Output of `turnbell doctor` and `turnbell status` helps.
    validations:
      required: true
